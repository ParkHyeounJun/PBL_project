customRules:
  pbl_rules.yaml: |-
    - rule: PBL Normal Pod Activity
      desc: Expected configuration read in the PBL normal scenario
      condition: >
        container and evt.type in (open, openat, openat2) and
        proc.name = cat and fd.name = /etc/hostname and
        container.name = frontend
      output: >
        PBL_EVENT scenario=normal category=pod_activity action=config_read
        file=%fd.name process=%proc.name command=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name
      priority: Informational
      tags: [pbl, normal]

    - rule: PBL Shadow File Access
      desc: Shadow file access in the first abnormal scenario
      condition: >
        container and evt.type in (open, openat, openat2) and
        proc.name = cat and fd.name = /etc/shadow and
        container.name = backend
      output: >
        PBL_EVENT scenario=abnormal_1 category=pod_activity action=shadow_read
        file=%fd.name process=%proc.name command=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name
      priority: Warning
      tags: [pbl, abnormal]

    - rule: PBL ServiceAccount Token Access
      desc: ServiceAccount token access in the second abnormal scenario
      condition: >
        container and evt.type in (open, openat, openat2) and
        proc.name = cat and fd.name contains kubernetes.io/serviceaccount and
        fd.name endswith token and container.name = backend
      output: >
        PBL_EVENT scenario=abnormal_2 category=pod_activity action=token_read
        file=%fd.name process=%proc.name command=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name
      priority: Warning
      tags: [pbl, abnormal]

    - rule: PBL Application Shell
      desc: Interactive shell in the third abnormal scenario
      condition: >
        container and spawned_process and proc.name = sh and
        proc.tty != 0 and container.name = frontend
      output: >
        PBL_EVENT scenario=abnormal_3 category=pod_activity action=shell_exec
        file=<NA> process=%proc.name command=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name
      priority: Warning
      tags: [pbl, abnormal]
